name: agent-config

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".agents/**"
      - ".claude/**"
      - ".pi/**"
      - "scripts/agent-config-lint.sh"
      - ".github/workflows/agent-config.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".agents/**"
      - ".claude/**"
      - ".pi/**"
      - "scripts/agent-config-lint.sh"
      - ".github/workflows/agent-config.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/agent-config-lint.sh
