name: agent-config

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".agents/**"
      - ".claude/**"
      - ".pi/**"
      - "scripts/agent-config-lint.sh"
      - ".github/workflows/agent-config.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".agents/**"
      - ".claude/**"
      - ".pi/**"
      - "scripts/agent-config-lint.sh"
      - ".github/workflows/agent-config.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/agent-config-lint.sh
